[project]
name = "expo-catalog"
version = "0.1.0"
description = "TUI catalog of every EVE Online cosmic signature and anomaly with fzf-style filtering"
authors = [
    { name = "grimmy0", email = "6683944+grimmy0@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.2.8",
]

[project.scripts]
expo-catalog = "expo_catalog:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
