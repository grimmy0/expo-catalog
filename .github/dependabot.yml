version: 2

updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Runtime and dev dependencies from pyproject.toml / uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"
