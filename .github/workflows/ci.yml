name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uvx ruff check src scraper tests

      - name: Format check
        run: uvx ruff format --check src scraper tests
