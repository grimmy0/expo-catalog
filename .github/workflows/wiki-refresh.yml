name: Wiki refresh

# Once a week, compare the EVE University wiki with data/wiki_state.json (metadata only, no page
# downloads). If anything changed, re-fetch, rebuild the catalog and open/update a pull request.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# No default token permissions; the job below asks for what it needs.
permissions: {}

concurrency:
  group: wiki-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Forks never query the wiki or open PRs.
    if: github.repository == 'grimmy0/expo-catalog'
    runs-on: ubuntu-latest
    # A full fetch is ~30 batched API requests at a 0.5 s delay plus ESI lookups: minutes, not hours.
    timeout-minutes: 30
    permissions:
      contents: write # push the auto/wiki-refresh branch
      pull-requests: write # open / update the pull request
    steps:
      # create-pull-request configures its own HTTPS credential from its `token` input, so the
      # checkout token does not need to stay in the git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Weekly job with write permissions: no shared cache to restore from or poison.
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Check the wiki for changes
        id: check
        run: |
          set +e
          uv run python -m scraper check --json check.json | tee check.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            echo "::error::wiki check failed (API error)"; exit 2
          fi
          changed=$(uv run python -c "import json; r=json.load(open('check.json')); print(len(r['changed']))")
          new=$(uv run python -c "import json; r=json.load(open('check.json')); print(len(r['new']))")
          removed=$(uv run python -c "import json; r=json.load(open('check.json')); print(len(r['removed']))")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "removed=$removed" >> "$GITHUB_OUTPUT"

      - name: Refresh the catalog
        if: steps.check.outputs.exit_code == '1'
        run: uv run python -m scraper refresh

      - name: Tests
        if: steps.check.outputs.exit_code == '1'
        run: uv run pytest -q

      - name: Write the pull request body
        if: steps.check.outputs.exit_code == '1'
        env:
          CHANGED: ${{ steps.check.outputs.changed }}
          NEW: ${{ steps.check.outputs.new }}
          REMOVED: ${{ steps.check.outputs.removed }}
        run: |
          {
            echo "Automated weekly refresh from the [EVE University wiki](https://wiki.eveuniversity.org)."
            echo
            echo "Pages: **${CHANGED} changed**, **${NEW} new**, **${REMOVED} removed**."
            echo
            echo "Review the flagged overrides in \`scraper/curated.py\` before merging; new pages may need classification rules."
            echo
            echo '```'
            cat check.txt
            echo '```'
          } > pr-body.md

      - name: Open or update the pull request
        if: steps.check.outputs.exit_code == '1'
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: auto/wiki-refresh
          delete-branch: true
          commit-message: "Wiki refresh: ${{ steps.check.outputs.changed }} changed / ${{ steps.check.outputs.new }} new pages"
          title: "Wiki refresh: ${{ steps.check.outputs.changed }} changed / ${{ steps.check.outputs.new }} new pages"
          body-path: pr-body.md
          labels: data-refresh
          add-paths: |
            src/expo_catalog/data/catalog.sqlite
            data/parsed_sites.json
            data/wiki_state.json
            data/systems.json

      - name: Summary
        if: always()
        env:
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          echo "exit code: ${EXIT_CODE}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f check.txt ]; then { echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "${PR_URL}" ]; then
            echo "PR: ${PR_URL} (${PR_OPERATION})" >> "$GITHUB_STEP_SUMMARY"
          fi
